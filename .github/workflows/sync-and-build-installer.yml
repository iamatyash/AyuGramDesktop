name: Build AyuGram Installer

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Upstream Release and Compare
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $upstream = gh api repos/AyuGram/AyuGramDesktop/releases/latest | ConvertFrom-Json
          $upstreamTag = $upstream.tag_name
          Write-Host "Latest Upstream Tag: $upstreamTag"

          $cleanVer = $upstreamTag -replace '^v',''
          "upstream_tag=$upstreamTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "clean_version=$cleanVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Check if our fork already has this release
          $exists = $false
          try {
            $null = gh release view $upstreamTag 2>$null
            if ($LASTEXITCODE -eq 0) {
              $exists = $true
            }
          } catch {
            $exists = $false
          }
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Host "Release $upstreamTag already exists on this fork."
            "should_build=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "Release $upstreamTag not found on this fork. Starting build!"
            "should_build=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit 0

      - name: Download Upstream AyuGram.zip
        if: steps.check_release.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.check_release.outputs.upstream_tag }}"
          Write-Host "Downloading AyuGram.zip for tag $tag..."
          gh release download $tag --repo AyuGram/AyuGramDesktop --pattern "AyuGram.zip" --output "AyuGram.zip"
          
          New-Item -ItemType Directory -Path "build_input" -Force | Out-Null
          tar -xf "AyuGram.zip" -C "build_input"
          Get-ChildItem "build_input"

      - name: Compile Inno Setup Installer
        if: steps.check_release.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.check_release.outputs.clean_version }}"
          Write-Host "Building AyuGram-Setup.exe for version $ver..."
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$ver" installer/ayugram.iss
          Get-Item "installer/output/AyuGram-Setup.exe"

      - name: Publish GitHub Release
        if: steps.check_release.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.check_release.outputs.upstream_tag }}"
          $title = "AyuGram Desktop $tag (Windows Installer)"
          $notes = "Automated build of AyuGram Desktop $tag with official Windows Installer packaging."

          gh release create $tag "installer/output/AyuGram-Setup.exe" "AyuGram.zip" `
            --title $title `
            --notes $notes
