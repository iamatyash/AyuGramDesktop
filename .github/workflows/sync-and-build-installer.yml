name: Auto-Sync Upstream & Build Installer

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 06:00 UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force build and release even if version already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Inno Setup
        uses: heaths/actions-setup-innosetup@v2

      - name: Check Upstream Release and Compare
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $upstream = gh api repos/AyuGram/AyuGramDesktop/releases/latest | ConvertFrom-Json
          $upstreamTag = $upstream.tag_name
          Write-Host "Latest Upstream Tag: $upstreamTag"

          $cleanVer = $upstreamTag -replace '^v',''
          Write-Output "upstream_tag=$upstreamTag" >> $env:GITHUB_OUTPUT
          Write-Output "clean_version=$cleanVer" >> $env:GITHUB_OUTPUT
          Write-Output "upstream_body=$($upstream.body)" >> $env:GITHUB_OUTPUT

          $force = "${{ inputs.force_release }}"
          if ($force -eq "true") {
            Write-Host "Forced build requested."
            Write-Output "should_build=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # Check if our fork already has this release
          $myRelease = gh release view $upstreamTag 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $upstreamTag already exists on this fork. Skipping."
            Write-Output "should_build=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Release $upstreamTag not found on this fork. Starting build!"
            Write-Output "should_build=true" >> $env:GITHUB_OUTPUT
          }

      - name: Download Upstream AyuGram.zip
        if: steps.check_release.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.check_release.outputs.upstream_tag }}"
          Write-Host "Downloading AyuGram.zip from AyuGram/AyuGramDesktop for tag $tag..."
          gh release download $tag --repo AyuGram/AyuGramDesktop --pattern "AyuGram.zip" --output "AyuGram.zip"
          
          New-Item -ItemType Directory -Path "build_input" -Force | Out-Null
          tar -xf "AyuGram.zip" -C "build_input"
          Get-ChildItem "build_input"

      - name: Compile Inno Setup Installer
        if: steps.check_release.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.check_release.outputs.clean_version }}"
          Write-Host "Building AyuGram-Setup.exe for version $ver..."
          iscc "/DMyAppVersion=$ver" installer/ayugram.iss
          Get-Item "installer/output/AyuGram-Setup.exe"

      - name: Publish GitHub Release
        if: steps.check_release.outputs.should_build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.check_release.outputs.upstream_tag }}"
          $title = "AyuGram Desktop $tag (with Windows Installer)"
          $notes = @"
          Automated build tracking official upstream [AyuGram/AyuGramDesktop](https://github.com/AyuGram/AyuGramDesktop).
          
          ### Assets Included:
          - **AyuGram-Setup.exe** — Standard Windows Installer with automatic Start Menu/Desktop shortcuts and `tg://` registration.
          - **AyuGram.zip** — Original portable release.
          
          Upstream release: https://github.com/AyuGram/AyuGramDesktop/releases/tag/$tag
          "@

          gh release create $tag "installer/output/AyuGram-Setup.exe" "AyuGram.zip" `
            --title $title `
            --notes $notes
